name: raspberrypi4b_monitoring_image_build

on:
  push:
    branches:
      - "main"
    paths:
      - "monitoring/hardware/raspberrypi_4b/*"
      - "monitoring/hardware/hw_monitoring_libraries/*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Read version
        id: version
        run: echo "value=$(cat workloads/custom_containers/hardware_monitoring/raspberrypi_4b/VERSION)" >> "$GITHUB_OUTPUT"      
            
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./workloads/custom_containers/hardware_monitoring/
          file: ./workloads/custom_containers/hardware_monitoring/raspberrypi_4b/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            markhamlee/rpi4b_monitoring:latest
            markhamlee/rpi4b_monitoring:${{ steps.version.outputs.value }}