name: amdcpu_nvidia_gpu_monitoring_image_build

on:
  push:
    branches:
      - "main"
    paths:
      - "workloads/custom_containers/hardware_monitoring/amdcpu_nvidiagpu/*"
      - "workloads/custom_containers/hardware_monitoring/hw_monitoring_libraries/*"
      
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Read version
              id: version
              run: echo "value=$(cat workloads/custom_containers/hardware_monitoring/amdcpu_nvidiagpu/VERSION)" >> "$GITHUB_OUTPUT"      
            
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./workloads/custom_containers/hardware_monitoring/
          file: ./workloads/custom_containers/hardware_monitoring/amdcpu_nvidiagpu/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            markhamlee/amdcpu_nvidia_monitoring:latest
            markhamlee/amdcpu_nvidia_monitoring:${{ steps.version.outputs.value }}