services:
  pgadmin:
    image: dpage/pgadmin4:8.8
    container_name: pgadmin
    hostname: pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'Authorized users only.'"
      PGADMIN_LISTEN_PORT: "80"
      SCRIPT_NAME: /pgadmin

    volumes:
      - /home/admin/.app_data/pgadmin:/var/lib/pgadmin

    networks:
      - proxy

    security_opt:
      - no-new-privileges:true

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.pgadmin.entrypoints=https"
      - "traefik.http.routers.pgadmin.rule=Host(`your-tailscale-server-url.ts.net`) && PathPrefix(`/pgadmin`)"
      - "traefik.http.routers.pgadmin.tls=true"
      - "traefik.http.routers.pgadmin.tls.certresolver=tsresolver"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

networks:
  proxy:
    external: true