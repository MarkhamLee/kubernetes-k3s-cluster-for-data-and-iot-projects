services:
  couchdb:
    image: couchdb:3.3
    container_name: couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_SECRET: ${COUCHDB_SECRET}
      NODENAME: ${COUCHDB_NODENAME}
      ERL_FLAGS: "-setcookie ${COUCHDB_COOKIE}"
    volumes:
      - /home/admin/.app_data/couchdb/data:/opt/couchdb/data
    networks:
      - proxy
    ports:
      - "5984:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5984/_up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
       - "traefik.enable=true"
       - "traefik.docker.network=proxy"
       - "traefik.http.routers.couchdb.entrypoints=https"
       - "traefik.http.routers.couchdb.rule=Host(`your-server-tailscale-url.ts.net`) && PathPrefix(`/obsidian_vault`)"
       - "traefik.http.routers.couchdb.tls=true"
       - "traefik.http.routers.couchdb.tls.certresolver=tsresolver"
       - "traefik.http.services.couchdb.loadbalancer.server.port=5984"
networks:
  proxy:
    external: true